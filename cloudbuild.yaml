# Cloud Build: build, push, and deploy Finnie to Cloud Run.
#
#   gcloud builds submit --config cloudbuild.yaml .
#
# One-time setup (Cloud SQL, runtime service account, secrets, permissions) is
# done by deploy/setup_gcp.sh, which also writes the substitutions below into
# deploy/.gcp.env and prints the exact submit command.
#
# `gcloud run deploy` merges into the existing service: settings not given here
# (VPC connector, other secrets and env vars such as ALLOWED_EMAILS and
# AUTH_REDIRECT_URI, IAM) carry over from the current revision unchanged.
substitutions:
  _REGION: us-central1
  _SERVICE: finnie-app
  _REPO: finnie
  _IMAGE_NAME: finnie-app
  _RUNTIME_SA: ""          # finnie-run@<project>.iam.gserviceaccount.com
  _CLOUDSQL_INSTANCE: ""   # <project>:<region>:<instance>
  # Peak p99 use over 30 days was ~1.4 GiB; 4 GiB leaves ~3x headroom. Memory
  # doesn't buy speed (CPU is set separately) — running out restarts the instance.
  _MEMORY: 4Gi
  _CPU: "2"
  # One instance stays warm (billed at the full rate around the clock, since CPU
  # throttling is off below) so visitors never wait for a cold start.
  # 0 scales to zero when idle: free, but slow to wake.
  _MIN_INSTANCES: "1"
  # Voice worker (src/voice/worker.py) as a Cloud Run worker pool. Off until
  # deploy/setup_gcp.sh's Voice stage has stored the LiveKit and speech keys; it
  # then saves _VOICE=1 in the deploy command.
  _VOICE: "0"
  _VOICE_POOL: finnie-voice
  _VOICE_IMAGE_NAME: finnie-voice
  # Each call runs in its own ~850 MB process; voice.idle_processes (2) stay loaded.
  # 8 GiB holds those plus about four calls at once; LiveKit stops giving the
  # instance calls at 70% CPU. One instance while voice is for testers.
  _VOICE_MEMORY: 8Gi
  _VOICE_CPU: "2"
  _VOICE_INSTANCES: "1"

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true

steps:
  # Fail in seconds, not after a ten-minute build, if setup hasn't been done.
  - id: check
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        [ -n "${_RUNTIME_SA}" ] || { echo "_RUNTIME_SA is empty: run deploy/setup_gcp.sh first"; exit 1; }
        [ -n "${_CLOUDSQL_INSTANCE}" ] || { echo "_CLOUDSQL_INSTANCE is empty: run deploy/setup_gcp.sh first"; exit 1; }

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/Dockerfile
      # Immutable per-build tag (what gets deployed, so every revision can be
      # rolled back to by tag) plus :latest for convenience.
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE_NAME}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE_NAME}:latest
      - .

  # Push before deploying: images listed under `images:` are only pushed after
  # every step, which would be too late for the deploy step.
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE_NAME}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE_NAME}:$BUILD_ID
      - --region=${_REGION}
      - --port=8501
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --cpu-boost
      - --min-instances=${_MIN_INSTANCES}
      # CPU stays allocated between requests. With request-based CPU, an instance
      # is throttled as soon as it is marked ready, so anything still loading
      # stalls until a visitor arrives: the min instance took 2-77 minutes to
      # warm up and the first visitor paid for it. Billed at the full rate.
      - --no-cpu-throttling
      # The container opens its port only once the workflow and embedding model
      # are loaded (FINNIE_WARM_BEFORE_SERVE in docker/entrypoint.sh), so the TCP
      # probe doubles as a readiness check. 5s x 120 = 600s, Cloud Run's maximum;
      # the app gives up waiting at 540s (FINNIE_WARMUP_TIMEOUT) and serves anyway.
      - --startup-probe=tcpSocket.port=8501,periodSeconds=5,timeoutSeconds=5,failureThreshold=120
      # gen2 runs on a full Linux kernel instead of gVisor; its much faster file
      # system is what the cold-start import of torch/LangChain is bound by.
      - --execution-environment=gen2
      # Streamlit holds a websocket per session; the 300s default cuts it every
      # five minutes. Affinity keeps a reconnecting browser on its instance.
      - --timeout=3600
      - --session-affinity
      # Least-privilege runtime identity instead of the default compute SA.
      - --service-account=${_RUNTIME_SA}
      # Cloud SQL via the built-in connector: a Unix socket at /cloudsql/<instance>.
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --update-secrets=DATABASE_URL=DATABASE_URL:latest

  # ── Voice worker: skipped unless _VOICE=1 ───────────────────────────────────
  # Built after the app so it reuses the builder stage's layers (same Docker
  # daemon), while the app image is pushed and deployed.
  - id: build-voice
    name: gcr.io/cloud-builders/docker
    waitFor: [build]
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        if [ "${_VOICE}" != "1" ]; then echo "voice off (_VOICE=${_VOICE}): not building the worker"; exit 0; fi
        docker build -f docker/Dockerfile --target voice \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_VOICE_IMAGE_NAME}:$BUILD_ID \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_VOICE_IMAGE_NAME}:latest .
        docker push --all-tags ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_VOICE_IMAGE_NAME}

  # After the app's deploy, so the app's migrations have run before the worker
  # starts. Its keys, voice flag and allowlist are copied from the app service
  # (deploy/worker_env.py), so the two can't drift apart.
  #
  # A worker pool gets 10 s between SIGTERM and SIGKILL, so a deploy ends calls in
  # progress (the page says "The call dropped"). Fine while voice is for testers;
  # revisit before general availability (design doc, Open question 2).
  - id: deploy-voice
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        if [ "${_VOICE}" != "1" ]; then echo "voice off (_VOICE=${_VOICE}): not deploying the worker"; exit 0; fi
        gcloud run services describe ${_SERVICE} --region=${_REGION} --format=json > /workspace/app-service.json
        # cloud-sdk:slim has no python3 on PATH; gcloud's bundled Python runs this stdlib script.
        PY="$$(command -v python3 || gcloud info --format='value(basic.python_location)')"
        ENV_VARS="$$("$$PY" deploy/worker_env.py env /workspace/app-service.json)"
        SECRETS="$$("$$PY" deploy/worker_env.py secrets /workspace/app-service.json)"
        gcloud run worker-pools deploy ${_VOICE_POOL} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_VOICE_IMAGE_NAME}:$BUILD_ID \
          --region=${_REGION} \
          --instances=${_VOICE_INSTANCES} \
          --cpu=${_VOICE_CPU} \
          --memory=${_VOICE_MEMORY} \
          --service-account=${_RUNTIME_SA} \
          --add-cloudsql-instances=${_CLOUDSQL_INSTANCE} \
          --update-env-vars="$$ENV_VARS" \
          --update-secrets="$$SECRETS"
