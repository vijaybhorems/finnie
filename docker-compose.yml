version: "3.9"

# ─────────────────────────────────────────────────────────
# Finnie — AI Finance Assistant
# All services share a single bridge network.
# Start with: docker compose up --build
# ─────────────────────────────────────────────────────────

services:

  # ── Redis cache ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: finnie_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finnie_net
    restart: unless-stopped

  # ── Postgres: per-user data + chat history ───────────
  # pgvector image so phase 4 (knowledge base on pgvector) needs no swap.
  # Local development only — the password is a default, override it via env.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finnie_postgres
    environment:
      POSTGRES_USER: finnie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finnie}
      POSTGRES_DB: finnie
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finnie -d finnie"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finnie_net
    restart: unless-stopped

  # ── RAG indexer (one-shot job to build FAISS index) ────
  rag_indexer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: finnie_rag_indexer
    command: >
      python -c "
      from src.rag.indexer import RAGIndexer;
      indexer = RAGIndexer();
      indexer.build_index(force=False);
      print('RAG index ready.')
      "
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ../.env
    volumes:
      - rag_index:/app/data/faiss_index
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - finnie_net

  # ── Streamlit web application ──────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: finnie_app
    ports:
      - "8501:8501"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://finnie:${POSTGRES_PASSWORD:-finnie}@postgres:5432/finnie
    env_file:
      - ../.env
    volumes:
      - rag_index:/app/data/faiss_index
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rag_indexer:
        condition: service_completed_successfully
    networks:
      - finnie_net
    restart: unless-stopped

volumes:
  redis_data:
  rag_index:
  postgres_data:

networks:
  finnie_net:
    driver: bridge
