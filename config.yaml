app:
  name: "Finnie - AI Finance Assistant"
  version: "1.0.0"
  debug: false
  log_level: "INFO"

llm:
  provider: "anthropic"
  model: "claude-sonnet-5"
  # NOTE: temperature is ignored for Sonnet 5 / Opus 4.8 — those models reject
  # sampling params (400). Kept for reference / legacy models only. See src/core/llm.py.
  temperature: 0.1
  max_tokens: 4096
  prompt_caching:
    # Caches each agent's stable system prompt (shared core + role) on
    # Anthropic's side. Claude Sonnet 5 only caches prefixes >= 1,024 tokens;
    # a shorter one silently doesn't cache (logged as prompt_cache_inactive).
    enabled: true
    ttl: "5m"   # "5m" (write 1.25x) or "1h" (write 2x) — see PromptCachingConfig

embeddings:
  model: "all-MiniLM-L6-v2"
  dimension: 384

rag:
  chunk_size: 512
  chunk_overlap: 64
  top_k: 5
  index_path: "data/faiss_index"
  knowledge_base_path: "src/data/knowledge_base"
  # "auto": pgvector (hybrid semantic + keyword search) when DATABASE_URL is
  # set, else the FAISS file index. Set "faiss" or "pgvector" to force one.
  backend: "auto"
  hybrid_candidates: 20   # candidates per ranker before rank fusion
  rrf_k: 60               # reciprocal rank fusion constant

redis:
  host: "localhost"
  port: 6379
  db: 0
  ttl_seconds: 3600  # 1 hour default cache TTL
  stale_ttl_seconds: 604800  # 7 days; retention for stale cache mirror

apis:
  alpha_vantage:
    base_url: "https://www.alphavantage.co/query"
    rate_limit_per_minute: 5  # Free tier limit
  fred:
    base_url: "https://api.stlouisfed.org/fred"
    rate_limit_per_minute: 120
  news_api:
    base_url: "https://newsapi.org/v2"
    page_size: 20
  sec_edgar:
    base_url: "https://efts.sec.gov/LATEST/search-index"

agents:
  finance_qa:
    name: "Finance Q&A Agent"
    description: "Answers general financial education questions"
    data_sources: ["fred", "rag"]
  portfolio:
    name: "Portfolio Analysis Agent"
    description: "Analyzes user portfolios with metrics and recommendations"
    data_sources: ["yfinance", "alpha_vantage"]
  market_analysis:
    name: "Market Analysis Agent"
    description: "Provides real-time market insights and technical analysis"
    data_sources: ["alpha_vantage", "yfinance"]
  goal_planning:
    name: "Goal Planning Agent"
    description: "Assists with financial goal setting based on risk appetite"
    data_sources: ["fred"]
  news_synthesizer:
    name: "News Synthesizer Agent"
    description: "Summarizes and contextualizes financial news"
    data_sources: ["news_api", "sec_edgar"]
  tax_education:
    name: "Tax Education Agent"
    description: "Explains tax concepts and account types"
    data_sources: ["rag"]

workflow:
  max_iterations: 10
  timeout_seconds: 60
  max_history_messages: 40  # conversation messages sent per LLM call

persistence:
  # User profile, holdings, saved plan and chat history. "auto" uses Postgres
  # when DATABASE_URL is set and falls back to in-process memory otherwise
  # (lost on restart). Set "postgres" to make a missing database a startup error.
  backend: "auto"
  pool_max_size: 10
  connect_timeout_seconds: 10

circuit_breaker:
  failure_threshold: 5
  recovery_timeout_seconds: 60
  success_threshold: 1

guardrail:
  enabled: true  # pre-router finance/NSFW gate; fails closed on classifier error

fast_path:
  # Phase 1 latency features — each flag is independently reversible.
  merged_classifier: true   # one structured guardrail+router call instead of two
  streaming: true           # stream agent tokens into the chat UI
  faq_cache:
    enabled: true
    backend: "auto"   # postgres when DATABASE_URL is set (shared across instances), else redis
    similarity_threshold: 0.92  # below this, fall through to the full workflow
    ttl_seconds: 604800         # 7 days
    max_entries: 500

tracing:
  enabled: false  # Arize Phoenix; enable and set endpoint to export spans
  project_name: "finnie"
  endpoint: ""  # e.g. http://localhost:4317 (local/gRPC) or https://app.phoenix.arize.com/s/<space> (Phoenix Cloud/HTTP)

memory:
  # Durable facts users share in chat ("saving for a house by 2028"), recalled
  # in later conversations. Users can see, delete, or switch this off.
  enabled: true
  min_confidence: 0.8         # keep only facts the extractor is sure were stated
  max_facts_per_turn: 5
  top_k: 5                    # memories injected per turn, most relevant first
  dedup_similarity: 0.85      # a near-identical new fact replaces the old one
  max_memories_per_user: 100

planning:
  default_inflation: 0.03  # used for real (inflation-adjusted) projection view
  max_horizon_years: 60
  max_events: 25

ui:
  port: 8501
  theme: "dark"
  max_conversation_history: 50
