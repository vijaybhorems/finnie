<div class="fv-call">
  <div class="fv-log" aria-live="polite"></div>
  <div class="fv-notice" role="status" hidden></div>
  <div class="fv-bar" role="group" aria-label="Voice call">
    <div class="fv-status"><span class="fv-dot" data-state="connecting"></span><span class="fv-status-text">Connecting…</span></div>
    <div class="fv-meter" aria-hidden="true"><div class="fv-meter-fill"></div></div>
    <span class="fv-timer" aria-label="Call time">0:00</span>
    <label class="fv-speak" title="Say dollar amounts aloud for this call. Off: they stay on your screen.">
      <input type="checkbox"><span>Speak amounts</span>
    </label>
    <button class="fv-unlock" type="button" hidden>Tap to hear Finnie</button>
    <button class="fv-mute" type="button" aria-pressed="false">Mute</button>
    <button class="fv-end" type="button">End</button>
  </div>
</div>
